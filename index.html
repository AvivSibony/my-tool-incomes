<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="התקציב שלי">
<meta name="theme-color" content="#f4f6f2">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon-512.png">
<title>התקציב שלי</title>
<style>
:root{--bg:#f4f6f2;--ink:#1b2a33;--mute:#62727b;--card:#fff;--line:#dde3dc;--ok:#1f7a6d;--warn:#d98e04;--over:#c0392b}
@media (prefers-color-scheme:dark){:root{--bg:#141b1f;--ink:#e8eeea;--mute:#98a8a0;--card:#1e282d;--line:#2c3a40;--ok:#4fc3ad;--warn:#f0b43c;--over:#ff7a6b}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Arial Hebrew",Arial,sans-serif;font-size:16px}
main{max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 96px)}
h1{margin:0;font-size:15px;font-weight:600;color:var(--mute)}
.total{font-size:44px;font-weight:800;letter-spacing:-1px;margin:2px 0 4px}
.total small{font-size:15px;font-weight:500;color:var(--mute);margin-inline-start:6px}
.banner{background:var(--over);color:#fff;padding:10px 14px;border-radius:12px;margin:12px 0;font-weight:600}
.hint{background:var(--card);border:1px dashed var(--line);padding:12px 14px;border-radius:12px;margin:12px 0;color:var(--mute)}
.card{background:var(--card);border-radius:14px;padding:14px;margin:12px 0;border-inline-start:6px solid var(--ok)}
.card.warn{border-color:var(--warn)}.card.over{border-color:var(--over)}
.row{display:flex;justify-content:space-between;align-items:center}
.pct{color:var(--mute);font-size:14px}
.left{font-size:24px;font-weight:700;margin:6px 0}
.over .left{color:var(--over)}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}
.warn .bar i{background:var(--warn)}.over .bar i{background:var(--over)}
.sub{font-size:13px;color:var(--mute);margin-top:6px}
h2{font-size:16px;margin:24px 0 8px}
.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.item .t{flex:1}.item .t small{display:block;color:var(--mute)}
.del{background:none;border:0;color:var(--mute);font-size:20px;padding:6px 10px}
label{display:block;margin:14px 0 6px;font-weight:600;font-size:14px}
input,select{width:100%;font:inherit;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
.prow{display:flex;gap:10px;align-items:center;margin:10px 0}
.prow span:first-child{flex:1}.prow input{width:80px;text-align:center}.prow .amt{width:100px;text-align:start;color:var(--mute);font-size:14px}
.btn{display:block;width:100%;margin-top:20px;padding:14px;border:0;border-radius:12px;background:var(--ink);color:var(--bg);font:inherit;font-weight:700}
.btn:disabled{opacity:.35}
.btn.alt{background:var(--card);color:var(--ink);border:1px solid var(--line);margin-top:10px}
.total-line{font-weight:700;margin-top:6px}.bad{color:var(--over)}
nav{position:fixed;bottom:0;inset-inline:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;padding:14px 4px;background:none;border:0;font:inherit;color:var(--mute)}
nav button.on{color:var(--ink);font-weight:800}
#toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);inset-inline:16px;background:var(--ink);color:var(--bg);padding:12px 14px;border-radius:12px;text-align:center;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}#toast.bad{background:var(--over);color:#fff}
.pie{width:150px;height:150px;border-radius:50%;margin:14px auto}
.leg{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;font-size:13px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-inline-end:5px}
.mnav{margin:6px 0 4px}.mnav b{font-size:18px}
.mrow{margin:10px 0;cursor:pointer}.mrow.on b{text-decoration:underline}
.mrow .bar i{background:var(--ink)}
.facts{display:flex;gap:8px;margin:10px 0}.facts div{flex:1;background:var(--card);border-radius:12px;padding:10px;text-align:center;font-size:13px;color:var(--mute)}.facts b{display:block;font-size:17px;color:var(--ink)}
.pick{display:flex;gap:8px;margin:6px 0}.pick select{flex:1}
.arrow{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 18px;font-size:24px;line-height:1.2;color:var(--ink)}
.mhead{margin:4px 0 8px}.mhead b{font-size:20px}
</style>
</head>
<body>
<main id="app"></main>
<nav id="nav"></nav>
<div id="toast"></div>
<script>
const CATS=[['fixed','הוצאות קבועות'],['lux','מותרות'],['save','חסכונות'],['inv','השקעות']];
const KEY='budget-v1';
const $=s=>document.querySelector(s);
const h=(t,a={},...c)=>{const e=document.createElement(t);for(const k in a){if(k==='class')e.className=a[k];else if(k.startsWith('on'))e.addEventListener(k.slice(2),a[k]);else e.setAttribute(k,a[k])}c.flat().forEach(x=>e.append(x));return e};
const f=n=>(Math.round(n*100)/100).toLocaleString('he-IL',{maximumFractionDigits:2})+' ₪';
let db={months:{}};
try{const r=JSON.parse(localStorage.getItem(KEY));if(r&&r.months)db=r}catch(e){}
let idbP=null;
const idb=()=>idbP||(idbP=new Promise((ok,no)=>{const q=indexedDB.open('budget-db',1);q.onupgradeneeded=()=>q.result.createObjectStore('k');q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)}));
const idbPut=v=>idb().then(d=>new Promise((ok,no)=>{const t=d.transaction('k','readwrite');t.objectStore('k').put(v,'db');t.oncomplete=ok;t.onerror=no})).catch(()=>{});
const idbGet=()=>idb().then(d=>new Promise((ok,no)=>{const q=d.transaction('k').objectStore('k').get('db');q.onsuccess=()=>ok(q.result);q.onerror=no})).catch(()=>null);
const hasData=x=>!!(x&&x.months&&Object.values(x.months).some(m=>m.salary>0||(m.expenses||[]).length));
function save(){db.savedAt=Date.now();let ok=true;try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){ok=false}
  idbPut(JSON.parse(JSON.stringify(db)));if(!ok)toast('השמירה נכשלה. בדוק שהאחסון בדפדפן לא חסום',1);return ok}
function toast(t,bad){const el=$('#toast');el.textContent=t;el.className='show'+(bad?' bad':'');clearTimeout(toast.t);toast.t=setTimeout(()=>el.className='',2800)}
const num=t=>{t=String(t).trim().replace(/\s/g,'');if(/^\d{1,3}(,\d{3})+(\.\d+)?$/.test(t))t=t.replace(/,/g,'');else t=t.replace(',','.');const v=parseFloat(t);return isFinite(v)?v:NaN};
const mk=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')};
function getM(k,create){if(db.months[k])return db.months[k];if(!create)return null;
  const pk=Object.keys(db.months).filter(x=>x<k).sort().pop()||Object.keys(db.months).sort()[0],p=pk&&db.months[pk];
  db.months[k]={salary:p?p.salary:0,pct:p?{...p.pct}:{fixed:50,lux:15,save:15,inv:20},expenses:[]};save();return db.months[k]}
const cur=()=>getM(mk(),true);
let hv=null;const hk=()=>hv||(hv=mk());
const shift=(k,n)=>{const[y,m]=k.split('-').map(Number),d=new Date(y,m-1+n,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')};
const spent=(m,k)=>Math.round(m.expenses.filter(e=>e.cat===k).reduce((s,e)=>s+e.amt,0)*100)/100;
const alloc=(m,k)=>Math.round(m.salary*m.pct[k])/100;
let tab='home';
function render(){
  const app=$('#app');app.replaceChildren(tab==='home'?home():tab==='add'?add():tab==='sum'?summary():settings());
  $('#nav').replaceChildren(...[['home','ראשי'],['add','+ הוצאה'],['sum','היסטוריה'],['set','הגדרות']].map(([k,n])=>h('button',{class:tab===k?'on':'',onclick:()=>{tab=k;render();scrollTo(0,0)}},n)));
}
function home(){
  const k0=hk(),m=getM(k0,k0===mk());
  const head=h('div',{},h('div',{class:'row mhead'},
    h('button',{class:'arrow','aria-label':'חודש קודם',onclick:()=>{hv=shift(k0,-1);render()}},'›'),
    h('b',{},mLabel(k0)),
    h('button',{class:'arrow','aria-label':'חודש הבא',onclick:()=>{hv=shift(k0,1);render()}},'‹')),
    k0!==mk()?h('button',{class:'btn alt',style:'margin:0 0 8px;padding:8px',onclick:()=>{hv=mk();render()}},'חזרה לחודש הנוכחי'):'');
  if(!m)return h('div',{},head,h('div',{class:'hint'},'אין נתונים לחודש הזה.'),
    h('button',{class:'btn',onclick:()=>{getM(k0,true);render()}},'התחל את החודש'),
    h('button',{class:'btn alt',onclick:()=>{vk=k0;tab='sum';render();scrollTo(0,0)}},'היסטוריה של חודשים קודמים ›'));
  const over=[],totalSpent=m.expenses.reduce((s,e)=>s+e.amt,0);
  const cards=CATS.map(([k,n])=>{
    const a=alloc(m,k),s=spent(m,k),left=a-s,r=a>0?s/a:(s>0?2:0),st=r>1?'over':r>=.8?'warn':'ok';
    if(st==='over')over.push(n);
    return h('section',{class:'card '+st},
      h('div',{class:'row'},h('b',{},n),h('span',{class:'pct'},m.pct[k]+'%')),
      h('div',{class:'left'},(left<0?'חריגה של ':'נשאר ')+f(Math.abs(left))),
      h('div',{class:'bar'},h('i',{style:'width:'+Math.min(100,r*100)+'%'})),
      h('div',{class:'sub'},'הוצאת '+f(s)+' מתוך '+f(a)))});
  const list=[...m.expenses].sort((a,b)=>b.id-a.id).slice(0,8).map(e=>exRow(m,e));
  return h('div',{},
    head,
    h('div',{class:'total'},f(m.salary-totalSpent),h('small',{},'נשאר מהשכר')),
    m.salary<=0?h('div',{class:'hint'},'עוד לא הגדרת שכר. עבור להגדרות כדי להתחיל.'):'',
    (Object.values(db.months).reduce((n,x)=>n+x.expenses.length,0)>=5&&(!db.lastBackup||Date.now()-db.lastBackup>30*864e5))?h('div',{class:'hint'},'לא גיבית את הנתונים כבר יותר מחודש. אפשר לגבות בהגדרות.'):'',
    over.length?h('div',{class:'banner'},'חריגה מהתקציב: '+over.join(', ')):'',
    ...cards,
    h('button',{class:'btn alt',onclick:()=>{vk=k0;tab='sum';render();scrollTo(0,0)}},'היסטוריה של חודשים קודמים ›'),
    list.length?h('h2',{},'הוצאות אחרונות'):'',...list);
}

const COL={fixed:'#1f7a6d',lux:'#d98e04',save:'#3b6fb6',inv:'#7a4fa3'};
const mTotal=m=>Math.round(m.expenses.reduce((x,e)=>x+e.amt,0)*100)/100;
const mLabel=k=>new Date(k+'-01T12:00:00').toLocaleDateString('he-IL',{month:'long',year:'numeric'});
function exRow(m,e){return h('div',{class:'item'},
  h('div',{class:'t'},e.desc||'ללא תיאור',h('small',{},CATS.find(c=>c[0]===e.cat)[1]+' · '+new Date(e.date).toLocaleDateString('he-IL'))),
  h('b',{},f(e.amt)),
  h('button',{class:'del','aria-label':'מחק',onclick:()=>{if(confirm('למחוק את ההוצאה?')){m.expenses=m.expenses.filter(x=>x.id!==e.id);save();render()}}},'×'))}
let vk=null;
function summary(){
  cur();const keys=Object.keys(db.months).sort();if(!vk)vk=mk();
  const[vy,vm]=vk.split('-'),m=db.months[vk];
  const years=[...new Set([...keys.map(k=>k.slice(0,4)),mk().slice(0,4)])].sort().reverse();
  const go=()=>{vk=ys.value+'-'+ms.value;render()};
  const ys=h('select',{'aria-label':'שנה',onchange:go},years.map(y=>h('option',{value:y},y)));
  const ms=h('select',{'aria-label':'חודש',onchange:go},Array.from({length:12},(_,i)=>h('option',{value:String(i+1).padStart(2,'0')},new Date(2000,i,1).toLocaleDateString('he-IL',{month:'long'}))));
  ys.value=vy;ms.value=vm;
  const pick=h('div',{class:'pick'},ms,ys);
  const trend=[...keys].reverse().map(k=>{const x=db.months[k],t=mTotal(x),r=x.salary>0?t/x.salary:(t>0?1:0);
    return h('div',{class:'mrow'+(k===vk?' on':''),onclick:()=>{vk=k;render();scrollTo(0,0)}},
      h('div',{class:'row'},h('b',{},mLabel(k)),h('span',{class:'pct'},f(t)+' מתוך '+f(x.salary))),
      h('div',{class:'bar'},h('i',{style:'width:'+Math.min(100,r*100)+'%'})))});
  if(!m)return h('div',{},pick,h('div',{class:'hint'},'אין נתונים לחודש הזה.'),keys.length?h('h2',{},'חודשים עם נתונים'):'',...trend);
  const tot=mTotal(m);
  let acc=0;const stops=CATS.map(([k])=>{const v=tot>0?spent(m,k)/tot*100:0,t=COL[k]+' '+acc+'% '+(acc+v)+'%';acc+=v;return t}).join(',');
  const legend=CATS.map(([k,n])=>h('span',{},h('i',{class:'dot',style:'background:'+COL[k]}),n+' '+(tot>0?Math.round(spent(m,k)/tot*100):0)+'%'));
  const cats=CATS.map(([k,n])=>{const a=alloc(m,k),s=spent(m,k),r=a>0?s/a:(s>0?2:0);
    return h('div',{class:'card '+(r>1?'over':r>=.8?'warn':'ok'),style:'margin:8px 0'},
      h('div',{class:'row'},h('b',{},n),h('span',{class:'pct'},f(s)+' / '+f(a))),
      h('div',{class:'bar'},h('i',{style:'width:'+Math.min(100,r*100)+'%'})))});
  const list=[...m.expenses].sort((a,b)=>b.date<a.date?-1:b.date>a.date?1:b.id-a.id).map(e=>exRow(m,e));
  return h('div',{},pick,
    h('div',{class:'facts'},h('div',{},'שכר',h('b',{},f(m.salary))),h('div',{},'הוצאות',h('b',{},f(tot))),h('div',{},m.salary-tot<0?'חריגה':'נשאר',h('b',{},f(Math.abs(m.salary-tot))))),
    tot>0?h('div',{},h('div',{class:'pie',role:'img','aria-label':'חלוקת ההוצאות בפועל',style:'background:conic-gradient('+stops+')'}),h('div',{class:'leg'},legend)):h('div',{class:'hint'},'אין הוצאות בחודש הזה.'),
    h('h2',{},'תקציב מול ביצוע'),...cats,
    h('h2',{},'כל החודשים'),...trend,
    list.length?h('h2',{},'הוצאות החודש'):'',...list);
}
function add(){
  const vm=hk(),d=new Date(),iso=vm===mk()?vm+'-'+String(d.getDate()).padStart(2,'0'):vm+'-01',[vy,vmo]=vm.split('-').map(Number);
  const amt=h('input',{type:'text',inputmode:'decimal',placeholder:'0'}),
    cat=h('select',{},CATS.map(([k,n])=>h('option',{value:k},n))),
    desc=h('input',{type:'text',placeholder:'למשל: סופר'}),
    date=h('input',{type:'date',value:iso,min:vm+'-01',max:vm+'-'+String(new Date(vy,vmo,0).getDate()).padStart(2,'0')});
  return h('div',{},h('h1',{},'הוצאה חדשה · '+mLabel(vm)),
    h('label',{},'סכום (₪)'),amt,h('label',{},'קטגוריה'),cat,h('label',{},'תיאור (לא חובה)'),desc,h('label',{},'תאריך'),date,
    h('button',{class:'btn',onclick:()=>{
      const v=num(amt.value);
      if(!(v>0)||v>10000000){toast('הכנס סכום גדול מאפס',1);return}
      if(!date.value||date.value.slice(0,7)!==vm){toast('בחר תאריך בתוך '+mLabel(vm),1);return}
      const m=getM(vm,true);m.expenses.push({id:Date.now(),amt:Math.round(v*100)/100,cat:cat.value,desc:desc.value.trim().slice(0,60),date:date.value});
      if(!save())return;
      const k=cat.value,name=CATS.find(c=>c[0]===k)[1];
      tab='home';render();
      if(spent(m,k)>alloc(m,k))toast('שים לב: חרגת מהתקציב של '+name,1);else toast('ההוצאה נשמרה');
    }},'שמור הוצאה'));
}
function settings(){
  const m=getM(hk(),true),sal=h('input',{type:'text',inputmode:'decimal',value:m.salary||''}),
    pin={},amts={},tot=h('div',{class:'total-line'}),btn=h('button',{class:'btn'},'שמור הגדרות');
  const rows=CATS.map(([k,n])=>{
    pin[k]=h('input',{type:'text',inputmode:'decimal',value:m.pct[k]});amts[k]=h('span',{class:'amt'});
    return h('div',{class:'prow'},h('span',{},n),pin[k],h('span',{},'%'),amts[k])});
  const read=()=>({s:num(sal.value)||0,p:Object.fromEntries(CATS.map(([k])=>[k,num(pin[k].value)||0]))});
  const upd=()=>{const{s,p}=read();let t=0;CATS.forEach(([k])=>{t+=p[k];amts[k].textContent=f(s*p[k]/100)});
    t=Math.round(t*100)/100;tot.textContent='סה"כ: '+t+'%'+(t===100?'':' (חייב להיות 100%)');const neg=CATS.some(([k])=>p[k]<0);if(neg)tot.textContent='אחוז לא יכול להיות שלילי';tot.className='total-line'+(t===100&&!neg?'':' bad');btn.disabled=t!==100||s<0||neg};
  [sal,...Object.values(pin)].forEach(i=>i.addEventListener('input',upd));
  btn.onclick=()=>{const{s,p}=read();m.salary=s;m.pct=p;if(save()){tab='home';render();toast('ההגדרות נשמרו')}};
  upd();
  const file=h('input',{type:'file',accept:'.json',style:'display:none'});
  file.onchange=async()=>{try{const j=JSON.parse(await file.files[0].text());if(!j.months||typeof j.months!=='object')throw 0;
    if(!confirm('השחזור יחליף את כל הנתונים הנוכחיים. להמשיך?'))return;db=j;if(save()){render();toast('הנתונים שוחזרו')}}catch(e){toast('הקובץ לא תקין',1)}};
  return h('div',{},h('h1',{},'הגדרות · '+mLabel(hk())),
    h('label',{},'שכר חודשי נטו (₪)'),sal,h('label',{},'חלוקה באחוזים'),...rows,tot,btn,
    h('h2',{},'גיבוי ושמירת נתונים'),h('div',{class:'hint'},'חודשים שמורים: '+Object.values(db.months).filter(x=>x.salary>0||x.expenses.length).length+' · נשמר אוטומטית פעמיים במכשיר · גיבוי אחרון לקובץ: '+(db.lastBackup?new Date(db.lastBackup).toLocaleDateString('he-IL'):'עדיין לא בוצע')),
    h('button',{class:'btn alt',onclick:()=>{db.lastBackup=Date.now();save();const a=h('a',{href:URL.createObjectURL(new Blob([JSON.stringify(db)],{type:'application/json'})),download:'budget-backup-'+mk()+'.json'});a.click();toast('הגיבוי ירד כקובץ')}},'גבה לקובץ'),
    h('button',{class:'btn alt',onclick:()=>file.click()},'שחזר מקובץ'),file);
}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
idbGet().then(x=>{if(hasData(x)&&!hasData(db)){db=x;try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}render();toast('הנתונים שוחזרו מהגיבוי האוטומטי')}else if(hasData(db))idbPut(JSON.parse(JSON.stringify(db)))});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
render();
</script>
</body>
</html>
